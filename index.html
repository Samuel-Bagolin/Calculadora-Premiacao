        const { useState, useMemo } = React;
        
        // Componente de ícone customizado para melhor centralização
        const CustomIcon = ({ name, size = 20, color = 'currentColor', className = '' }) => {
            const iconMap = {
                calculator: 'fas fa-calculator',
                target: 'fas fa-bullseye',
                trendingDown: 'fas fa-chart-line',
                badgePercent: 'fas fa-percentage',
                alertTriangle: 'fas fa-exclamation-triangle',
                shieldCheck: 'fas fa-shield-alt',
                coins: 'fas fa-coins',
                barChart3: 'fas fa-chart-bar',
                layers: 'fas fa-layer-group',
                trophy: 'fas fa-trophy',
                award: 'fas fa-award',
                medal: 'fas fa-medal',
                chartPie: 'fas fa-chart-pie',
                building: 'fas fa-building',
                database: 'fas fa-database'
            };
            
            return React.createElement('i', {
                className: `${iconMap[name] || 'fas fa-question-circle'} ${className}`,
                style: {
                    fontSize: `${size}px`,
                    color: color,
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center'
                }

        };
        
        // Regras de premiação baseadas no percentual de churn
        const CHURN_RULES = [
            { maxPercent: 2, bonus: 200, zone: 'Excelente', color: 'bg-emerald-500', textColor: 'text-emerald-700', bgColor: 'bg-emerald-50', borderColor: 'border-emerald-200' },
            { maxPercent: 2.5, bonus: 175, zone: 'Muito Bom', color: 'bg-green-500', textColor: 'text-green-700', bgColor: 'bg-green-50', borderColor: 'border-green-200' },
            { maxPercent: 3, bonus: 150, zone: 'Bom', color: 'bg-teal-500', textColor: 'text-teal-700', bgColor: 'bg-teal-50', borderColor: 'border-teal-200' },
            { maxPercent: 3.5, bonus: 125, zone: 'Regular', color: 'bg-yellow-400', textColor: 'text-yellow-700', bgColor: 'bg-yellow-50', borderColor: 'border-yellow-200' },
            { maxPercent: 4, bonus: 100, zone: 'Atenção', color: 'bg-orange-400', textColor: 'text-orange-700', bgColor: 'bg-orange-50', borderColor: 'border-orange-200' },
            { maxPercent: 4.5, bonus: 75, zone: 'Preocupante', color: 'bg-orange-500', textColor: 'text-orange-800', bgColor: 'bg-orange-100', borderColor: 'border-orange-300' },
            { maxPercent: 5, bonus: 50, zone: 'Crítico', color: 'bg-red-400', textColor: 'text-red-700', bgColor: 'bg-red-50', borderColor: 'border-red-200' },
            { maxPercent: 5.5, bonus: 25, zone: 'Muito Crítico', color: 'bg-red-500', textColor: 'text-red-800', bgColor: 'bg-red-100', borderColor: 'border-red-300' },
            { maxPercent: Infinity, bonus: 0, zone: 'Extremo', color: 'bg-red-600', textColor: 'text-red-900', bgColor: 'bg-red-100', borderColor: 'border-red-300' }
        ];
        
        // Formatters
        const formatCurrency = (value) => {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL',
            }).format(value);
        };
        
        const formatPercent = (value) => {
            return value.toLocaleString('pt-BR', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2,
            }) + '%';
        };

                    className: "flex flex-col"

                        key: 'value',

                    }, value),
                    subValue && React.createElement('span', {
                        key: 'subvalue',
                        className: "text-xs text-slate-400 mt-1"
                    }, subValue)

            ]);
        }
        
        // Main App Component
        function App() {
            const [mrrPerdidoOpenix, setMrrPerdidoOpenix] = useState('');
            const [mrrPerdidoSittax, setMrrPerdidoSittax] = useState('');
            const [valorTotalOpenix, setValorTotalOpenix] = useState('');
            const [valorTotalSittax, setValorTotalSittax] = useState('');
            
            const parseInput = (val) => {
                if (!val) return 0;
                const cleanValue = val.replace(/\./g, '').replace(',', '.');
                const parsed = parseFloat(cleanValue);
                return isNaN(parsed) || parsed < 0 ? 0 : parsed;
            };
            
            const results = useMemo(() => {
                if (mrrPerdidoOpenix === '' && mrrPerdidoSittax === '' && valorTotalOpenix === '' && valorTotalSittax === '') return null;
                
                const vMrrPerdidoOpenix = parseInput(mrrPerdidoOpenix);
                const vMrrPerdidoSittax = parseInput(mrrPerdidoSittax);
                const vValorTotalOpenix = parseInput(valorTotalOpenix);
                const vValorTotalSittax = parseInput(valorTotalSittax);
                
                // Cálculo do percentual de churn: (MRR Perdido Openix + MRR Perdido Sittax) / (Valor Total MRR Openix + Valor Total MRR Sittax)
                const totalMrrPerdido = vMrrPerdidoOpenix + vMrrPerdidoSittax;
                const totalMrrBase = vValorTotalOpenix + vValorTotalSittax;
                
                // Evitar divisão por zero
                const churnPercent = totalMrrBase > 0 ? (totalMrrPerdido / totalMrrBase) * 100 : 0;
                
                const rule = CHURN_RULES.find(r => churnPercent <= r.maxPercent) || CHURN_RULES[CHURN_RULES.length - 1];
                
                return {
                    mrrPerdidoOpenix: vMrrPerdidoOpenix,
                    mrrPerdidoSittax: vMrrPerdidoSittax,
                    valorTotalOpenix: vValorTotalOpenix,
                    valorTotalSittax: vValorTotalSittax,
                    totalMrrPerdido,
                    totalMrrBase,
                    churnPercent,
                    ...rule
                };
            }, [mrrPerdidoOpenix, mrrPerdidoSittax, valorTotalOpenix, valorTotalSittax]);

                const value = e.target.value.replace(/[^0-9,]/g, '');
                setMrrPerdidoOpenix(value);
            };
            
            const handleMrrPerdidoSittaxChange = (e) => {
                const value = e.target.value.replace(/[^0-9,]/g, '');
                setMrrPerdidoSittax(value);
            };

                setValorTotalOpenix(value);
            };

                        }, [

                            }),

                        ]),

                                }, React.createElement(CustomIcon, {

                                    size: 18, 
                                    color: "#4f46e5" 
                                })),
                                React.createElement('h2', {

                            ]),
                            React.createElement('div', {

                                className: "space-y-6"
                            }, [
                                // MRR Perdido Openix
                                React.createElement('div', { key: 'mrr-perdido-openix' }, [
                                    React.createElement('div', {

                                    }, [
                                        React.createElement('div', {

                                        }, [
                                            React.createElement(CustomIcon, {

                                            }),

                                                className: "block text-[10px] font-black text-slate-500 uppercase tracking-widest"
                                            }, "MRR Perdido Openix")
                                        ])

                                    React.createElement('div', {

                                    }, [
                                        React.createElement('div', {

                                        }, [

                                            }, [
